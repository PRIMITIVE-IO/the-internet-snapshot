# Builds the API server image and publishes it to GitHub Container Registry (ghcr.io).
# Optionally deploys it to Azure Container Apps, GitHub's first-party managed container host. To enable, set
# repository variables AZURE_CONTAINERAPP_NAME and AZURE_RESOURCE_GROUP, plus OIDC secrets AZURE_CLIENT_ID,
# AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID.
name: publish-image
on:
  push:
    branches: [main]
    paths: ["internet_snapshot/**", "Dockerfile", "requirements.txt", "viewer/**", "public/snapshots/latest.json",
            ".github/workflows/publish-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - id: ref
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
  deploy-azure:
    needs: image
    if: ${{ vars.AZURE_CONTAINERAPP_NAME != '' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: ${{ needs.image.outputs.image }}
          containerAppName: ${{ vars.AZURE_CONTAINERAPP_NAME }}
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          targetPort: 8000
          ingress: external
