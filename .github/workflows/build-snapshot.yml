# Rebuilds the snapshot from public datasets, commits it to public/snapshots/ on main, then deploys GitHub Pages.
# GitHub-hosted runners have open egress, so every source fetcher can reach its host here.
name: build-snapshot
on:
  schedule:
    - cron: "17 4 * * 1"   # weekly, Monday 04:17 UTC
  workflow_dispatch:
    inputs:
      caida:
        description: "Use CAIDA AS relationships (ask-first licence; confirm permission before enabling)"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build-snapshot
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-build.txt pytest anyio "mcp>=1.2"
      - name: Fetch public datasets
        run: |
          python -m internet_snapshot fetch --refresh --strict
          python -m internet_snapshot fetch --refresh --source apis_guru || echo "apis_guru unavailable; continuing"
          if [ "${{ inputs.caida }}" = "true" ]; then
            python -m internet_snapshot fetch --refresh --strict --source caida_asrel --source caida_as2org
          fi
      - name: Build snapshot
        run: |
          ARGS="--resolve-dns"
          if [ "${{ inputs.caida }}" = "true" ]; then ARGS="$ARGS --caida"; fi
          python -m internet_snapshot build $ARGS
      - run: python -m pytest -q
      - name: Commit snapshot
        run: |
          git config user.name "internet-snapshot-bot"
          git config user.email "internet-snapshot-bot@users.noreply.github.com"
          git add -A public/snapshots
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Publish snapshot $(python -c 'import json;print(json.load(open("public/snapshots/latest.json"))["snapshot_id"])')"
          git push
  pages:
    needs: build
    uses: ./.github/workflows/pages.yml
