[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internet-snapshot"
version = "0.2.0"
description = "A living, frozen 3D snapshot of the internet built from public datasets, served to Primitive environment clients and AI agents."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "scipy>=1.11", "healpy>=1.16", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
build = ["pillow>=10", "resvg-py>=0.2"]
dev = ["pytest>=8", "anyio>=4", "matplotlib>=3.8"]

[tool.setuptools]
packages = { find = { include = ["internet_snapshot*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
